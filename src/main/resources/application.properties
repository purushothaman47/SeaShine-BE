spring.application.name=SeaShinePvtLtd
spring.datasource.url=jdbc:mysql://localhost:3306/sample
spring.datasource.username=root
spring.datasource.password=1234@Dpp#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8080
# --- Resume uploads ---
app.upload.resume-dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Liquibase ---
# Point Spring Boot's Liquibase auto-configuration at the master
# changelog added under src/main/resources/db/changelog/.
# On startup it creates DATABASECHANGELOG / DATABASECHANGELOGLOCK
# tracking tables and applies any changeset not yet recorded there.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# The seed-data changesets are tagged context="dev,demo". Leave this
# unset (or set to dev,demo) for local/demo databases so sample rows
# load; set it to an empty value in production so only schema
# changesets run and no demo rows are inserted.
spring.liquibase.contexts=dev,demo
app.upload.gallery-dir=uploads/gallery
